<!doctype html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f1012" />
		<meta name="color-scheme" content="dark light" />
		<title>mz_automanga</title>
		<link rel="stylesheet" href="/assets/css/base.css" />
		<link rel="stylesheet" href="/assets/css/layout.css" />
		<link rel="stylesheet" href="/assets/css/components.css" />
		<link rel="stylesheet" href="/assets/css/mobile.css" />
	</head>
	<body>
		<header class="bar">
			<div class="brand">mz_automanga</div>
			<label class="project-picker">
				<span class="sr-only">选择项目</span>
				<select id="project" title="项目"></select>
			</label>
			<nav class="tabs" role="tablist" aria-label="视图">
				<button class="tab active" id="tab-pages" data-view="pages" role="tab" aria-selected="true" aria-controls="pages-view" tabindex="0">漫画</button>
				<button class="tab" id="tab-cast" data-view="cast" role="tab" aria-selected="false" aria-controls="cast-view" tabindex="-1">人设</button>
			</nav>
			<div id="status" class="status" aria-live="polite">加载中…</div>
		</header>

		<main id="pages-view" class="view" role="tabpanel" aria-labelledby="tab-pages">
			<div id="grid" class="grid" aria-live="polite"></div>
		</main>
		<main id="cast-view" class="view" role="tabpanel" aria-labelledby="tab-cast" hidden>
			<div id="cast-grid" class="cast-grid" aria-live="polite"></div>
		</main>

		<div id="reader" class="reader" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
			<div class="reader-top">
				<span id="reader-counter" class="reader-counter"></span>
				<button class="close" id="close" aria-label="关闭预览">✕</button>
			</div>
			<img id="reader-image" alt="" draggable="false" />
			<button class="nav prev" id="prev" aria-label="上一张">‹</button>
			<button class="nav next" id="next" aria-label="下一张">›</button>
		</div>

		<noscript>请启用 JavaScript 以查看漫画预览。</noscript>
		<script type="module" src="/assets/js/main.js"></script>
	</body>
</html>
